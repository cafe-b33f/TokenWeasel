name: Feature request
description: Propose a focused improvement to TokenWeasel
title: "feature: "
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately using the process in SECURITY.md, not through this public form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and configuration or API impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive examples, references, or constraints.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
