name: Bug report
description: Report reproducible incorrect behavior in TokenWeasel
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately using the process in SECURITY.md, not through this public form.
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the release version or commit hash.
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Proxying and routing
        - Authentication and accounts
        - Usage, pricing, or energy accounting
        - Configuration and startup
        - TLS
        - Dashboard
        - Release artifacts
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal configuration and numbered steps. Redact all secrets.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, installation method, backend, and relevant versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Paste relevant output after removing credentials, API keys, private data, and access tokens.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
